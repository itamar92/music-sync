# Deploy-mode stack for smart-home. Unlike docker-compose.yml (the local dev
# stack, which builds from source and publishes a host port), this one pulls
# prebuilt images from GHCR and stays internal — only the cloudflared sidecar
# reaches the frontend, and it serves music-sync.im-tools.org.
#
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d --no-build
#
# IMAGE_TAG is set by .github/workflows/deploy.yml; .env at the deploy checkout
# supplies the secrets.
services:
  db:
    image: postgres:16-alpine
    container_name: music-sync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-musicsync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicsync} -d ${POSTGRES_DB:-musicsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/itamar92/music-sync-backend:${IMAGE_TAG:-latest}
    container_name: music-sync-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-musicsync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-musicsync}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      # Empty is tolerated: the stack boots and /api/status reports hasToken:false
      # until a refresh token is provisioned (see SETUP_REFRESH_TOKEN.md).
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "8080"

  # nginx: serves the SPA and proxies /api/* to backend:8080.
  # Named `app` because the tunnel config routes to http://app:80.
  app:
    image: ghcr.io/itamar92/music-sync-frontend:${IMAGE_TAG:-latest}
    container_name: music-sync
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: music-sync-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # Creds + config staged at the deploy checkout by provision.ps1.
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app

volumes:
  pgdata:
