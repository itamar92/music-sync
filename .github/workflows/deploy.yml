# Generated by the deploy-server-setup skill, adapted for two images
# (nginx frontend + Express backend): build+push to GHCR on a GitHub-hosted
# runner, join Tailscale, SSH into smart-home to pull+restart, then verify the
# public URL at https://music-sync.im-tools.org.
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      ns: ${{ steps.ns.outputs.value }}
    steps:
      - name: Short-SHA tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Lowercase image namespace (GHCR requires lowercase)
        id: ns
        run: echo "value=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: Dockerfile.frontend
          - image: backend
            context: ./server
            dockerfile: ./server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.prepare.outputs.ns }}-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.ns }}-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Pull images & restart stack on smart-home
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          # Windows OpenSSH default shell varies; invoke Git Bash explicitly so the whole
          # pipeline runs under one shell with `set -e`. GHCR auth is pre-seeded into a temp
          # DOCKER_CONFIG to bypass Docker Desktop's wincred helper (fails over SSH).
          script: |
            "C:\Program Files\Git\bin\bash.exe" -lc 'set -euo pipefail; cd "${{ secrets.DEPLOY_PATH }}" && git fetch git@github.com:${{ github.repository }}.git main && git reset --hard FETCH_HEAD && TMP=$(mktemp -d) && trap "rm -rf \"$TMP\"" EXIT && AUTH=$(printf "%s:%s" "$GHCR_USER" "$GHCR_TOKEN" | base64 -w 0) && printf "{\"auths\":{\"ghcr.io\":{\"auth\":\"%s\"}}}" "$AUTH" > "$TMP/config.json" && export DOCKER_CONFIG="$(cygpath -w "$TMP")" && export IMAGE_TAG="$IMAGE_TAG" && docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d --no-build --remove-orphans && docker image prune -f'

  verify:
    name: Verify public URL
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # No Tailscale here on purpose: probe the real public path
      # (DNS -> Cloudflare tunnel -> container) exactly as a browser would.
      - name: Probe health endpoint
        env:
          HEALTH_URL: ${{ secrets.PUBLIC_API_URL }}/healthz
        run: |
          echo "Probing $HEALTH_URL"
          for i in $(seq 1 18); do
            if curl -fsS -m 8 "$HEALTH_URL" >/dev/null 2>&1; then
              echo "Healthy."; exit 0
            fi
            echo "Attempt $i/18: not healthy yet; retrying in 5s..."; sleep 5
          done
          echo "::error::$HEALTH_URL did not return 2xx within ~90s (container down, or DNS / Cloudflare tunnel route missing)."
          exit 1
