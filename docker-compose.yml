services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-musicsync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicsync} -d ${POSTGRES_DB:-musicsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-musicsync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-musicsync}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:?}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:?}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8090}:80"

  # Optional: expose the site via Cloudflare Tunnel instead of opening ports.
  # Start with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  pgdata:
